[project]
name = "bluedot-technical-ai-safety-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fire>=0.7.1",
    "inspect-ai>=0.3.291",
    "openai>=3.55.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[project.scripts]
# Rent and prepare vast.ai GPUs; see src/ic_eval/vast/cli.py.
ic-vast = "ic_eval.vast.cli:cli"

[build-system]
# Makes `uv sync` install src/ic_eval/ (editable) and create the ic-vast command in .venv/bin.
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The distribution is named after the repo, the importable package is ic_eval.
module-name = "ic_eval"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
# `uv run pytest` from the repo root. Tests never rent anything or call vast.ai: market and
# remote calls are not exercised, the model and policy run on simulated data.
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
# Explicit settings, so results do not shift with ruff's changing defaults. `make check` runs
# ruff check, `make format` fixes and formats.
line-length = 100
src = ["src", "tests", "tasks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]

[tool.basedpyright]
include = ["src", "tests", "tasks"]
typeCheckingMode = "standard"
# Stricter than "standard" where it catches real mistakes cheaply.
reportUnnecessaryComparison = true
reportUnnecessaryCast = true
reportMatchNotExhaustive = true
reportUnusedExpression = true
reportImportCycles = true
